[tool:pytest]
# Directories that are not visited by pytest collector
norecursedirs = .git .eggs .cache build dist venv

# Extra options
addopts = 
    --strict-markers
    --no-header
    
# Coverage options
[coverage:run]
source = api
omit = 
    */tests/*
    */venv/*
    */__pycache__/*
    */.eggs/*
    
[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    
[flake8]
max-line-length = 100
exclude = .git,__pycache__,build,dist,venv
